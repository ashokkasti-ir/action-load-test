name: API Load Test

# Runs one k6 burst per matrix entry. Every job gets its own runner and its
# own InvisiRisk PSE proxy, and all k6 traffic goes through that proxy.
# The rate is kept low enough for the proxy to inspect every request
# without queueing (see README "Load through the InvisiRisk proxy").

on:
  workflow_dispatch:
    inputs:
      rate:
        description: "Requests per second, per matrix job"
        required: true
        default: "150"
        type: string
      duration:
        description: "How long each job sustains that rate (k6 format: 10s, 1m)"
        required: true
        default: "15s"
        type: string
      p95_ms:
        description: "Fail a job if its p95 latency exceeds this many ms"
        required: true
        default: "1000"
        type: string
      max_error_rate:
        description: "Fail a job if its error rate exceeds this fraction (0.01 = 1%)"
        required: true
        default: "0.01"
        type: string

permissions:
  checks: write
  actions: read
  contents: read

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  load-test:
    name: ${{ matrix.api.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Let every variation finish so one slow endpoint doesn't hide the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
        api:
          - name: get-single-post
            method: GET
            url: https://jsonplaceholder.typicode.com/posts/1
            expected_status: "200"
            body: ""
          - name: create-post
            method: POST
            url: https://jsonplaceholder.typicode.com/posts
            expected_status: "201"
            body: '{"title":"load test","body":"created by k6","userId":1}'
          - name: patch-post
            method: PATCH
            url: https://jsonplaceholder.typicode.com/posts/1
            expected_status: "200"
            body: '{"title":"patched"}'
    env:
      # Inputs go through env vars, never straight into `run:` scripts,
      # so a crafted input can't inject shell commands.
      TARGET_URL: ${{ matrix.api.url }}
      METHOD: ${{ matrix.api.method }}
      BODY: ${{ matrix.api.body }}
      EXPECTED_STATUS: ${{ matrix.api.expected_status }}
      RATE: ${{ inputs.rate || '150' }}
      DURATION: ${{ inputs.duration || '15s' }}
      P95_MS: ${{ inputs.p95_ms || '1000' }}
      MAX_ERROR_RATE: ${{ inputs.max_error_rate || '0.01' }}
      AUTH_TOKEN: ${{ secrets.LOAD_TEST_AUTH_TOKEN }}
    steps:
      # ============= InvisiRisk Setup =============
      - name: Setup PSE
        uses: invisirisk/pse-action@latest
        with:
          app_token: ${{secrets.IR_TOKEN}}
          api_url: https://app.stage.invisirisk.com
      # ============= InvisiRisk Setup End =============
      - uses: actions/checkout@v7

      - name: Validate inputs
        run: |
          [[ "$RATE" =~ ^[0-9]+$ ]] && (( RATE > 0 )) || { echo "::error::rate must be a positive integer"; exit 1; }
          [[ "$DURATION" =~ ^[0-9]+(ms|s|m|h)$ ]] || { echo "::error::duration must look like 10s, 2m"; exit 1; }
          [[ "$P95_MS" =~ ^[0-9]+$ ]] || { echo "::error::p95_ms must be a whole number"; exit 1; }
          [[ "$MAX_ERROR_RATE" =~ ^(0(\.[0-9]+)?|1)$ ]] || { echo "::error::max_error_rate must be between 0 and 1"; exit 1; }

      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          # Pinned: setup-k6-action installs the latest k6 otherwise, and a
          # major k6 release has broken unpinned pipelines before.
          k6-version: "2.3.0"

      - name: Run load test
        # k6 honours HTTP_PROXY/HTTPS_PROXY set by the PSE action, so every
        # request is sent through the InvisiRisk proxy.
        run: |
          echo "Proxy: ${HTTPS_PROXY:-none}"
          k6 run --summary-export=summary.json tests/load-test.js

      - name: Write job summary
        if: always() && hashFiles('summary.json') != ''
        env:
          NAME: ${{ matrix.api.name }} (${{ matrix.os }})
        run: |
          jq -r --arg name "$NAME" --arg url "$TARGET_URL" --arg method "$METHOD" --arg rate "$RATE" --arg dur "$DURATION" '
            .metrics as $m
            | ($m.http_req_duration) as $d
            | def ms: . * 100 | round / 100 | tostring + " ms";
              def pct: . * 10000 | round / 100 | tostring + "%";
            "## \($name): `\($method) \($url)`",
            "",
            "Target: **\($rate) req/s for \($dur)**",
            "",
            "| Metric | Value |",
            "|---|---|",
            "| Requests sent | \($m.http_reqs.count) |",
            "| Achieved rate | \($m.http_reqs.rate | round) req/s |",
            "| Failed requests | \($m.http_req_failed.value | pct) |",
            "| Dropped iterations (proxy or API could not keep up) | \($m.dropped_iterations.count // 0) |",
            "| Max VUs used | \($m.vus_max.max) |",
            "| Latency avg | \($d.avg | ms) |",
            "| Latency median | \($d.med | ms) |",
            "| Latency p90 | \($d["p(90)"] | ms) |",
            "| Latency p95 | \($d["p(95)"] | ms) |",
            "| Latency p99 | \($d["p(99)"] | ms) |",
            "| Latency max | \($d.max | ms) |"
          ' summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-summary-${{ matrix.api.name }}-${{ matrix.os }}
          path: summary.json
          if-no-files-found: ignore
