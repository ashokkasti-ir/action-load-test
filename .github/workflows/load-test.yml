name: API Load Test

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Full URL to hit. Default is JSONPlaceholder, a free public mock API (use .../posts with POST, expected 201)"
        required: true
        default: "https://jsonplaceholder.typicode.com/posts/1"
        type: string
      method:
        description: "HTTP method"
        required: true
        default: GET
        type: choice
        options: [GET, POST, PUT, PATCH, DELETE]
      rate:
        description: "Requests per second"
        required: true
        default: "1000"
        type: string
      duration:
        description: "How long to sustain that rate (k6 format: 10s, 1m)"
        required: true
        default: "10s"
        type: string
      body:
        description: "Request body (JSON string), optional"
        required: false
        type: string
      headers:
        description: 'Extra headers as JSON, e.g. {"X-Api-Key":"abc"} (use the LOAD_TEST_AUTH_TOKEN secret for bearer tokens)'
        required: false
        type: string
      expected_status:
        description: "Status code that counts as success"
        required: true
        default: "200"
        type: string
      p95_ms:
        description: "Fail the run if p95 latency exceeds this many ms"
        required: true
        default: "1000"
        type: string
      max_error_rate:
        description: "Fail the run if the error rate exceeds this fraction (0.01 = 1%)"
        required: true
        default: "0.01"
        type: string

permissions:
  contents: read

concurrency:
  group: load-test
  cancel-in-progress: false

jobs:
  load-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Inputs go through env vars, never straight into `run:` scripts,
      # so a crafted input can't inject shell commands.
      TARGET_URL: ${{ inputs.target_url }}
      METHOD: ${{ inputs.method }}
      RATE: ${{ inputs.rate }}
      DURATION: ${{ inputs.duration }}
      BODY: ${{ inputs.body }}
      HEADERS: ${{ inputs.headers }}
      EXPECTED_STATUS: ${{ inputs.expected_status }}
      P95_MS: ${{ inputs.p95_ms }}
      MAX_ERROR_RATE: ${{ inputs.max_error_rate }}
      AUTH_TOKEN: ${{ secrets.LOAD_TEST_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate inputs
        run: |
          [[ "$TARGET_URL" =~ ^https?:// ]] || { echo "::error::target_url must start with http:// or https://"; exit 1; }
          [[ "$RATE" =~ ^[0-9]+$ ]] && (( RATE > 0 )) || { echo "::error::rate must be a positive integer"; exit 1; }
          [[ "$DURATION" =~ ^[0-9]+(ms|s|m|h)$ ]] || { echo "::error::duration must look like 10s, 2m"; exit 1; }
          [[ "$EXPECTED_STATUS" =~ ^[1-5][0-9][0-9]$ ]] || { echo "::error::expected_status must be an HTTP status code"; exit 1; }
          if [[ -n "$HEADERS" ]]; then echo "$HEADERS" | jq -e 'type == "object"' > /dev/null || { echo "::error::headers must be a JSON object"; exit 1; }; fi

      - name: Install k6
        uses: grafana/setup-k6-action@v1
        with:
          # Pinned: setup-k6-action installs the latest k6 otherwise, and a
          # major k6 release has broken unpinned pipelines before.
          k6-version: "2.3.0"

      - name: Run load test
        run: k6 run --summary-export=summary.json tests/load-test.js

      - name: Write job summary
        if: always() && hashFiles('summary.json') != ''
        run: |
          jq -r --arg url "$TARGET_URL" --arg method "$METHOD" --arg rate "$RATE" --arg dur "$DURATION" '
            .metrics as $m
            | ($m.http_req_duration) as $d
            | def ms: . * 100 | round / 100 | tostring + " ms";
              def pct: . * 10000 | round / 100 | tostring + "%";
            "## Load test: `\($method) \($url)`",
            "",
            "Target: **\($rate) req/s for \($dur)**",
            "",
            "| Metric | Value |",
            "|---|---|",
            "| Requests sent | \($m.http_reqs.count) |",
            "| Achieved rate | \($m.http_reqs.rate | round) req/s |",
            "| Failed requests | \($m.http_req_failed.value | pct) |",
            "| Dropped iterations (runner could not keep up) | \($m.dropped_iterations.count // 0) |",
            "| Max VUs used | \($m.vus_max.max) |",
            "| Latency avg | \($d.avg | ms) |",
            "| Latency median | \($d.med | ms) |",
            "| Latency p90 | \($d["p(90)"] | ms) |",
            "| Latency p95 | \($d["p(95)"] | ms) |",
            "| Latency p99 | \($d["p(99)"] | ms) |",
            "| Latency max | \($d.max | ms) |"
          ' summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: k6-summary
          path: summary.json
          if-no-files-found: ignore
